<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Miles Traveled</title>
  <meta name="theme-color" content="#f5efe2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="airmail"></div>
  <header class="topbar">
    <button class="brand" data-click="go" data-arg="home">✈︎ <span>Miles Traveled</span></button>
    <div class="row" style="gap:8px">
      <div id="whoBar" class="who"></div>
      <button class="icon" data-click="more" aria-label="More">☰</button>
    </div>
  </header>

  <main id="app">
    <div id="loading" class="loading">Loading your travels…</div>
    <section id="page-login" class="page"></section>
    <section id="page-home" class="page"></section>
    <section id="page-map" class="page"><div id="mapWrap"><div id="map"></div><div id="mapPanel" class="map-panel"></div><div id="replayBar" class="replay hidden"></div></div></section>
    <section id="page-trips" class="page"></section>
    <section id="page-stories" class="page"></section>
    <section id="page-people" class="page"></section>
    <section id="page-stats" class="page"></section>
  </main>

  <button id="fab" class="fab" aria-label="Add" data-click="addMenu">＋</button>

  <nav class="tabbar">
    <button data-page="home" class="on"><span>⌂</span>Home</button>
    <button data-page="map"><span>◎</span>Map</button>
    <button data-page="trips"><span>✈︎</span>Trips</button>
    <button data-page="stories"><span>✎</span>Stories</button>
    <button data-page="people"><span>☺</span>People</button>
    <button data-page="stats"><span>▥</span>Stats</button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <div class="sheet-head"><button class="icon" id="sheetBack" aria-label="Back">‹</button><h2 id="sheetTitle"></h2><button class="icon" id="sheetClose" aria-label="Close">✕</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="wrapped" class="wrapped hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
